{# Universal Knowledge Graph sidebar component — System Registry + Canonical Vocabulary #}

<div id="ukg-sidebar-inner" class="w-96 border-l flex flex-col h-full transition-colors duration-200"
     style="background: var(--sidebar-bg); border-color: var(--sidebar-border);">
    <div class="flex items-center justify-between px-4 py-4 border-b transition-colors duration-200"
         style="background: var(--sidebar-header-bg); border-color: var(--sidebar-border);">
        <h2 class="text-lg font-semibold transition-colors duration-200" style="color: var(--sidebar-text);">Universal Knowledge Graph</h2>
        <div class="flex items-center gap-2">
            <button id="ukg-theme-toggle" onclick="toggleUkgTheme()" class="p-1.5 rounded transition-colors hover:opacity-80" style="color: var(--sidebar-text-muted);" aria-label="Toggle theme" title="Toggle light/dark theme">
                <svg id="ukg-theme-icon-sun" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <svg id="ukg-theme-icon-moon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
            <button id="ukg-refresh-btn" onclick="refreshUkg(true)" class="p-1.5 rounded transition-colors disabled:opacity-50 disabled:cursor-not-allowed hover:opacity-80" style="color: var(--sidebar-text-muted);" aria-label="Refresh universal knowledge graph" title="Refresh universal knowledge graph">
                <svg id="ukg-refresh-icon" class="w-4 h-4 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
            <button onclick="toggleUkgSidebar()" class="p-1.5 rounded transition-colors hover:opacity-80" style="color: var(--sidebar-text-muted);" aria-label="Collapse universal knowledge graph" title="Collapse sidebar">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex border-b transition-colors duration-200" style="border-color: var(--sidebar-border);">
        <button id="ukg-tab-systems" onclick="switchUkgTab('systems')" class="ukg-tab flex-1 px-3 py-2 text-sm font-medium border-b-2 transition-colors duration-200" style="color: var(--sidebar-tab-active-text); background: var(--sidebar-tab-active-bg); border-color: var(--sidebar-tab-active-text);">Systems</button>
        <button id="ukg-tab-vocabulary" onclick="switchUkgTab('vocabulary')" class="ukg-tab flex-1 px-3 py-2 text-sm font-medium border-b-2 border-transparent transition-colors duration-200" style="color: var(--sidebar-text-muted);">Vocabulary</button>
    </div>

    <!-- Tab content -->
    <div class="flex-1 overflow-y-auto p-4 transition-colors duration-200" style="background: var(--sidebar-bg);">
        <div id="ukg-tab-content-systems" class="ukg-tab-content">
            <div id="ukg-systems-content">
                <p class="text-sm text-center py-4" style="color: var(--sidebar-text-muted);">Loading systems...</p>
            </div>
        </div>
        <div id="ukg-tab-content-vocabulary" class="ukg-tab-content hidden">
            <div id="ukg-vocabulary-content">
                <p class="text-sm text-center py-4" style="color: var(--sidebar-text-muted);">Loading vocabulary...</p>
            </div>
        </div>
    </div>
</div>
