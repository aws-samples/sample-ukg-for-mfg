<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lightPlaceholderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f6f8fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="200" height="200" rx="30" ry="30" fill="url(#lightPlaceholderGrad)"/>
  <rect width="200" height="200" rx="30" ry="30" fill="none" stroke="#0969da" stroke-width="3" opacity="0.2"/>

  <!-- Digital thread network -->
  <g>
    <!-- Flowing thread curves -->
    <path d="M 40 70 C 65 70, 70 100, 100 100 C 130 100, 135 130, 160 130"
          fill="none" stroke="#0969da" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <path d="M 40 130 C 65 130, 70 100, 100 100 C 130 100, 135 70, 160 70"
          fill="none" stroke="#0969da" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <!-- Vertical thread -->
    <path d="M 100 38 C 100 60, 100 80, 100 100 C 100 120, 100 140, 100 162"
          fill="none" stroke="#0969da" stroke-width="3" stroke-linecap="round" opacity="0.3"/>

    <!-- Outer nodes -->
    <circle cx="40" cy="70" r="14" fill="none" stroke="#0969da" stroke-width="4" opacity="0.7"/>
    <circle cx="40" cy="70" r="5" fill="#0969da" opacity="0.7"/>

    <circle cx="160" cy="70" r="14" fill="none" stroke="#0969da" stroke-width="4" opacity="0.7"/>
    <circle cx="160" cy="70" r="5" fill="#0969da" opacity="0.7"/>

    <circle cx="40" cy="130" r="14" fill="none" stroke="#0969da" stroke-width="4" opacity="0.7"/>
    <circle cx="40" cy="130" r="5" fill="#0969da" opacity="0.7"/>

    <circle cx="160" cy="130" r="14" fill="none" stroke="#0969da" stroke-width="4" opacity="0.7"/>
    <circle cx="160" cy="130" r="5" fill="#0969da" opacity="0.7"/>

    <circle cx="100" cy="38" r="12" fill="none" stroke="#0969da" stroke-width="3.5" opacity="0.6"/>
    <circle cx="100" cy="38" r="4" fill="#0969da" opacity="0.6"/>

    <circle cx="100" cy="162" r="12" fill="none" stroke="#0969da" stroke-width="3.5" opacity="0.6"/>
    <circle cx="100" cy="162" r="4" fill="#0969da" opacity="0.6"/>

    <!-- Center hub node -->
    <circle cx="100" cy="100" r="24" fill="none" stroke="#0969da" stroke-width="5"/>
    <circle cx="100" cy="100" r="10" fill="#0969da"/>
  </g>
</svg>
