<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f6f8fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#lightGrad)"/>
  <rect width="200" height="200" fill="none" stroke="#0969da" stroke-width="6" opacity="0.3"/>

  <!-- Digital Thread symbol -->
  <g>
    <!-- Flowing thread -->
    <path d="M 50 55 C 80 55, 80 100, 100 100 C 120 100, 120 145, 150 145"
          fill="none" stroke="#0969da" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <path d="M 55 60 C 85 60, 85 105, 105 105 C 125 105, 125 150, 155 150"
          fill="none" stroke="#0969da" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

    <!-- Node 1 (top-left) -->
    <circle cx="50" cy="55" r="18" fill="none" stroke="#0969da" stroke-width="5"/>
    <circle cx="50" cy="55" r="7" fill="#0969da"/>

    <!-- Node 2 (center hub) -->
    <circle cx="100" cy="100" r="22" fill="none" stroke="#0969da" stroke-width="5"/>
    <circle cx="100" cy="100" r="9" fill="#0969da"/>

    <!-- Node 3 (bottom-right) -->
    <circle cx="150" cy="145" r="18" fill="none" stroke="#0969da" stroke-width="5"/>
    <circle cx="150" cy="145" r="7" fill="#0969da"/>

    <!-- Radiating connections -->
    <line x1="100" y1="100" x2="150" y2="60" stroke="#0969da" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <circle cx="150" cy="60" r="10" fill="none" stroke="#0969da" stroke-width="4" opacity="0.6"/>
    <circle cx="150" cy="60" r="4" fill="#0969da" opacity="0.6"/>

    <line x1="100" y1="100" x2="50" y2="145" stroke="#0969da" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <circle cx="50" cy="145" r="10" fill="none" stroke="#0969da" stroke-width="4" opacity="0.6"/>
    <circle cx="50" cy="145" r="4" fill="#0969da" opacity="0.6"/>
  </g>
</svg>
