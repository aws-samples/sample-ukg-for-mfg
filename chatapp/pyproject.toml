# ChatApp tool configuration.
#
# Runtime dependencies are managed via `requirements.txt` (installed by the
# Dockerfiles and local-dev venv setup). This file is tool config only —
# pytest auto-discovers the [tool.pytest.ini_options] section when you run
# `pytest` from the chatapp/ directory.
#
# If you need to add another tool's config (ruff, mypy, etc.), add its
# [tool.<name>] section here rather than creating a separate config file.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
